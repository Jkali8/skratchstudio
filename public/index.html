<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKRATCH STUDIO — Landing page options</title>
<link rel="stylesheet" href="brand.css">
<style>
  html,body{margin:0;height:100%;background:#f0eee9}
  .ab-frame{width:100%;height:100%;border:0;display:block;background:#fff}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const W = 1440;
function Page({src}){
  return <iframe className="ab-frame" src={src} scrolling="no" loading="eager" title={src}></iframe>;
}
function App(){
  return (
    <DesignCanvas>
      <DCSection id="landing" title="SKRATCH STUDIO — Landing page" subtitle="Three directions · same brand system · click ⤢ to focus any one full-screen">
        <DCArtboard id="a" label="A · Cover Story — magazine cover + editor's letter" width={W} height={5920}>
          <Page src="option-a.html" />
        </DCArtboard>
        <DCArtboard id="b" label="B · The Kiosk — masthead, contents, bento" width={W} height={3360}>
          <Page src="option-b.html" />
        </DCArtboard>
        <DCArtboard id="c" label="C · The Feature — editorial spread, ribbon, columns" width={W} height={5765}>
          <Page src="option-c.html" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
